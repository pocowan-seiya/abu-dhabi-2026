<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>意識のテクノロジー × チームラボ　共創のご提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root {
    --bg: #FBFAF6;
    --ink: #17266B;
    --text: #2A3A80;
    --soft: #6B6F95;
    --gold: #9C7A3C;
    --line: #E6DABD;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background:
      radial-gradient(ellipse 70% 40% at 85% 0%, rgba(250, 238, 205, .6), rgba(250, 238, 205, 0) 70%),
      var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.8;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px max(16px, 4vw) 72px; }
  header { text-align: center; margin-bottom: 40px; }
  .rule { width: 48px; height: 2px; background: var(--gold); margin: 0 auto 22px; }
  h1 {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 600; color: var(--ink);
    font-size: clamp(22px, 3.4vw, 34px); letter-spacing: .06em; line-height: 1.5;
    text-wrap: balance;
  }
  .nw { display: inline-block; }
  .from { margin-top: 12px; color: var(--soft); font-size: 15px; letter-spacing: .06em; }
  .pdf {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 26px; padding: 12px 26px;
    border: 1.5px solid var(--gold); border-radius: 999px;
    color: var(--ink); text-decoration: none; font-size: 15px; letter-spacing: .06em;
    background: rgba(255,255,255,.7);
    transition: background .2s;
  }
  .pdf:hover { background: #FBF3DF; }
  .pdf small { color: var(--soft); font-size: 13px; }
  .slides { display: flex; flex-direction: column; gap: 28px; }
  figure {
    background: var(--card); border-radius: 10px; overflow: hidden;
    box-shadow: 0 10px 34px rgba(40, 50, 110, .08); border: 1px solid #EEE7D8;
  }
  figure img { display: block; width: 100%; height: auto; aspect-ratio: 1672 / 941; }
  footer {
    margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line);
    text-align: center; line-height: 1.9;
  }
  footer .name { font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif; color: var(--ink); font-size: 18px; font-weight: 600; letter-spacing: .1em; }
  footer .org { font-size: 14px; }
  footer .links { margin-top: 4px; font-size: 14px; color: var(--soft); }
  footer a { color: var(--text); }
  @media (max-width: 600px) {
    .wrap { padding-top: 40px; }
    .slides { gap: 16px; }
    figure { border-radius: 6px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="rule"></div>
      <h1><span class="nw">意識のテクノロジー</span> <span class="nw">× チームラボ</span><br>共創のご提案</h1>
      <p class="from">江藤せいや ｜ じぶんの宇宙意識を生きる学校</p>
      <a class="pdf" href="teamlab-proposal-eto-seiya.pdf" download="teamLab_共創のご提案_江藤せいや.pdf">PDFで見る <small>13ページ・約2MB</small></a>
    </header>

    <main class="slides">
      <figure><img src="slide_01.jpg" alt="1 / 13" width="1672" height="941"></figure>
      <figure><img src="slide_02.jpg" alt="2 / 13" width="1672" height="941"></figure>
      <figure><img src="slide_03.jpg" alt="3 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_04.jpg" alt="4 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_05.jpg" alt="5 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_06.jpg" alt="6 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_07.jpg" alt="7 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_08.jpg" alt="8 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_09.jpg" alt="9 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_10.jpg" alt="10 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_11.jpg" alt="11 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_12.jpg" alt="12 / 13" width="1672" height="941" loading="lazy"></figure>
      <figure><img src="slide_13.jpg" alt="13 / 13" width="1672" height="941" loading="lazy"></figure>
    </main>

    <footer>
      <p class="name">江藤せいや</p>
      <p class="org">じぶんの宇宙意識を生きる学校</p>
      <p class="links">info@pocowan.com ｜ <a href="https://sekinoayako.art" target="_blank" rel="noopener">https://sekinoayako.art</a></p>
    </footer>
  </div>
</body>
</html>
